name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      # Uses ci if package-lock.json is present, otherwise install
      run: npm ci || npm install

    - name: Run CI tasks (typecheck, lint, test, build)
      run: npm run ci
