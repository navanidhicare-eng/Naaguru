  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              teal: '#087F6C',
              'teal-dark': '#056052',
              'teal-light': '#E6F5F1',
              amber: '#F4B942',

              text: '#172321',
              muted: '#647572',
              border: '#DCE6E3',
              error: '#D9383A',
              'error-bg': '#FDF2F2',
              whatsapp: '#25D366',
              'whatsapp-light': '#E8F8EE'

          },

            sans: ['Inter', 'sans-serif'],

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b1317; /* Canvas background preview frame */
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Strict Mobile Viewport Container 390 x 844 */
    .mobile-frame {
      width: 390px;
      height: 844px;
      max-height: 844px;
      background-color: #F8FAF9;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.45);
      border-radius: 40px;
      border: 6px solid #1f2937;
    }

    /* Hide standard scrollbars for native app feel */
    .mobile-frame::-webkit-scrollbar {
      display: none;
    }
    .mobile-frame {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Native OTP Box Focus and caret effects */
    .otp-box {
      width: 46px;
      height: 54px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #172321;
      background: #FFFFFF;
      border: 1.5px solid #DCE6E3;
      border-radius: 12px;
      outline: none;
      transition: all 0.2s ease;
    }
    .otp-box:focus {
      border-color: #087F6C;
      box-shadow: 0 0 0 3px rgba(8, 127, 108, 0.15);
      transform: translateY(-1px);
    }
    .otp-box.filled {
      border-color: #087F6C;
      background-color: #FAFFFD;
    }
    .otp-box.error-state {
      border-color: #D9383A;
      background-color: #FDF2F2;
      color: #D9383A;
      animation: shake 0.35s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }

    /* Telugu font typography fine-tuning */
    body.lang-te {
      font-family: 'Noto Sans Telugu', 'Inter', sans-serif;
    }
    body.lang-te .telugu-font {
      font-family: 'Noto Sans Telugu', sans-serif;
      line-height: 1.45;
    }
  </style>
</head>

  <script>
    // Bilingual Text Dictionary
    const i18n = {
      en: {
        brandTitle: "Naaguru",
        heading: "Check your WhatsApp",
        subtitle: "We sent a 6-digit verification code to",

        errorExpired: "This code has expired. Please request a new one.",
        errorLocked: "Too many attempts. Please try again later.",
        successMsg: "Code verified successfully!",
        modalTitle: "Number Verified!",
        modalSub: "Redirecting to Create Your Profile...",
        modalCta: "Continue to Profile →"
      },
      te: {
        brandTitle: "నాగురు",
        heading: "మీ WhatsApp చూడండి",
        subtitle: "మీ WhatsAppకు 6 అంకెల వెరిఫికేషన్ కోడ్ పంపించాము.",
        instruction: "కొనసాగడానికి ఆ కోడ్‌ను నమోదు చేయండి.",
        edit: "మార్చండి",
        didntReceive: "కోడ్ రాలేదా?",
        resendPrefix: "",
        resendSuffix: " సెకన్లలో మళ్లీ పంపవచ్చు",
        resendAction: "కోడ్‌ను మళ్లీ పంపండి",
        changeNumber: "మొబైల్ నంబర్ మార్చండి",
        cta: "ధృవీకరించి కొనసాగండి →",
        trustNote: "సులభమైన వెరిఫికేషన్ • Naaguru మీ గోప్యతను కాపాడుతుంది",
        errorInvalid: "కోడ్ సరిపోలడం లేదు. కోడ్‌ను మళ్లీ చెక్ చేయండి.",
        errorExpired: "ఈ కోడ్ గడువు ముగిసింది. కొత్త కోడ్‌ను పొందండి.",
        errorLocked: "చాలా సార్లు ప్రయత్నించారు. కొంత సమయం తర్వాత మళ్లీ ప్రయత్నించండి.",
        successMsg: "కోడ్ విజయవంతంగా ధృవీకరించబడింది!",
        modalTitle: "నంబర్ ధృవీకరించబడింది!",
        modalSub: "మీ ప్రొఫైల్ సృష్టికి తరలిస్తున్నాము...",
        modalCta: "ప్రొఫైల్‌కు కొనసాగండి →"
      }
    };

    let currentLang = 'en';
    let countdownSec = 28;
    let timerInterval = null;
    let currentState = 'default';

    // Elements
    const otpInputs = [
      document.getElementById('otp-1'),
      document.getElementById('otp-2'),
      document.getElementById('otp-3'),
      document.getElementById('otp-4'),
      document.getElementById('otp-5'),
      document.getElementById('otp-6')
    ];
    const btnVerifyCta = document.getElementById('btn-verify-cta');
    const ctaLabel = document.getElementById('cta-label');
    const ctaSpinner = document.getElementById('cta-spinner');
    const statusBanner = document.getElementById('status-banner');
    const statusContent = document.getElementById('status-content');
    const statusIcon = document.getElementById('status-icon');
    const statusText = document.getElementById('status-text');
    const resendCountdown = document.getElementById('resend-countdown');
    const btnResendAction = document.getElementById('btn-resend-action');

    // Language Switching
    function setLanguage(lang) {
      currentLang = lang;
      const dict = i18n[lang];

      if (lang === 'te') {
        document.body.classList.add('lang-te');
        document.getElementById('btn-lang-te').className = "px-2.5 py-1 text-xs font-semibold rounded-full bg-brand-teal text-white transition-all";
        document.getElementById('btn-lang-en').className = "px-2.5 py-1 text-xs font-medium rounded-full text-brand-muted hover:text-brand-text transition-all";
      } else {
        document.body.classList.remove('lang-te');
        document.getElementById('btn-lang-en').className = "px-2.5 py-1 text-xs font-semibold rounded-full bg-brand-teal text-white transition-all";
        document.getElementById('btn-lang-te').className = "px-2.5 py-1 text-xs font-medium rounded-full text-brand-muted hover:text-brand-text transition-all";
      }

      document.getElementById('header-brand-title').textContent = dict.brandTitle;
      document.getElementById('screen-heading').textContent = dict.heading;
      document.getElementById('screen-subtitle').textContent = dict.subtitle;
      document.getElementById('screen-instruction').textContent = dict.instruction;
      document.getElementById('btn-edit-num').textContent = dict.edit;
      document.getElementById('txt-didnt-receive').textContent = dict.didntReceive;
      document.getElementById('btn-resend-action').textContent = dict.resendAction;
      document.getElementById('btn-change-number').textContent = dict.changeNumber;
      document.getElementById('cta-label').textContent = dict.cta;
      document.getElementById('footer-trust-note').textContent = dict.trustNote;
      document.getElementById('modal-success-title').textContent = dict.modalTitle;
      document.getElementById('modal-success-sub').textContent = dict.modalSub;

      updateCountdownDisplay();
      
      // Update any active error banners
      if (currentState === 'invalid') {
        showStatus('error', dict.errorInvalid);
      } else if (currentState === 'expired') {
        showStatus('error', dict.errorExpired);
      } else if (currentState === 'locked') {
        showStatus('error', dict.errorLocked);
      }
    }

    // OTP Input Autoadvance & Paste Handling
    otpInputs.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = val ? val[0] : '';
        
        if (val) {
          input.classList.add('filled');
          input.classList.remove('error-state');
          if (idx < 5) {
            otpInputs[idx + 1].focus();
          }
        } else {
          input.classList.remove('filled');
        }

        checkOtpCompletion();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && idx > 0) {
          otpInputs[idx - 1].focus();
          otpInputs[idx - 1].value = '';
          otpInputs[idx - 1].classList.remove('filled');
          checkOtpCompletion();
        }
      });

      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasteData = (e.clipboardData || window.clipboardData).getData('text').trim().replace(/[^0-9]/g, '');
        if (pasteData) {
          for (let i = 0; i < 6; i++) {
            if (pasteData[i]) {
              otpInputs[i].value = pasteData[i];
              otpInputs[i].classList.add('filled');
              otpInputs[i].classList.remove('error-state');
            }
          }
          const focusIndex = Math.min(pasteData.length, 5);
          otpInputs[focusIndex].focus();
          checkOtpCompletion();
        }
      });
    });

    function getOtpValue() {
      return otpInputs.map(input => input.value).join('');
    }

    function checkOtpCompletion() {
      const otp = getOtpValue();
      if (otp.length === 6 && currentState !== 'locked') {
        btnVerifyCta.disabled = false;
        clearStatus();
      } else {
        btnVerifyCta.disabled = true;
      }
    }

    // Status Banner Helpers
    function showStatus(type, message) {
      statusContent.classList.remove('hidden', 'bg-red-50', 'text-brand-error', 'border', 'border-red-200', 'bg-green-50', 'text-brand-teal', 'border-green-200');
      
      if (type === 'error') {
        statusContent.classList.add('bg-red-50', 'text-brand-error', 'border', 'border-red-200');
        statusIcon.innerHTML = `<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>`;
      } else if (type === 'success') {
        statusContent.classList.add('bg-green-50', 'text-brand-teal', 'border', 'border-green-200');
        statusIcon.innerHTML = `<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`;
      }
      statusText.textContent = message;
    }

    function clearStatus() {
      statusContent.classList.add('hidden');
    }

    // Countdown Timer logic
    function startCountdown() {
      countdownSec = 28;
      resendCountdown.classList.remove('hidden');
      btnResendAction.classList.add('hidden');
      updateCountdownDisplay();

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        countdownSec--;
        if (countdownSec <= 0) {
          clearInterval(timerInterval);
          resendCountdown.classList.add('hidden');
          btnResendAction.classList.remove('hidden');
        } else {
          updateCountdownDisplay();
        }
      }, 1000);
    }

    function updateCountdownDisplay() {
      if (currentLang === 'te') {
        resendCountdown.textContent = `${countdownSec}${i18n.te.resendSuffix}`;
      } else {
        resendCountdown.textContent = `${i18n.en.resendPrefix}${countdownSec}s`;
      }
    }

    function handleResendCode() {
      startCountdown();
      showStatus('success', currentLang === 'te' ? "కొత్త కోడ్ WhatsAppలో పంపబడింది." : "New verification code sent on WhatsApp.");
      setTimeout(clearStatus, 3500);
    }

    // Verification Submission
    function handleVerify() {
      if (btnVerifyCta.disabled) return;

      const otp = getOtpValue();
      ctaLabel.textContent = currentLang === 'te' ? "ధృవీకరిస్తోంది..." : "Verifying...";
      ctaSpinner.classList.remove('hidden');
      btnVerifyCta.disabled = true;

      setTimeout(() => {
        ctaSpinner.classList.add('hidden');
        ctaLabel.textContent = i18n[currentLang].cta;

        if (currentState === 'invalid' || otp === '000000') {
          otpInputs.forEach(i => i.classList.add('error-state'));
          showStatus('error', i18n[currentLang].errorInvalid);
          btnVerifyCta.disabled = false;
        } else if (currentState === 'expired') {
          otpInputs.forEach(i => i.classList.add('error-state'));
          showStatus('error', i18n[currentLang].errorExpired);
          resendCountdown.classList.add('hidden');
          btnResendAction.classList.remove('hidden');
          btnVerifyCta.disabled = false;
        } else if (currentState === 'locked') {
          showStatus('error', i18n[currentLang].errorLocked);
          btnVerifyCta.disabled = true;
        } else {
          // Success Flow
          document.getElementById('success-modal').classList.remove('hidden');
        }
      }, 700);
    }

    function closeSuccessModal() {
      document.getElementById('success-modal').classList.add('hidden');
      alert("Transitioning to: 'Naaguru - Create Your Profile'");
    }

    function handleBackAction() {
      alert("Returning to: 'Enter Your Mobile Number'");
    }

    function handleChangeNumber() {
      handleBackAction();
    }

    // State Demo Previews (Active, Invalid, Expired, Locked)
    function setDemoState(state) {
      currentState = state;
      ['default', 'invalid', 'expired', 'locked'].forEach(s => {
        const pill = document.getElementById(`pill-${s}`);
        if (s === state) {
          pill.className = "text-[10px] px-2 py-0.5 rounded-md font-medium bg-white text-brand-teal shadow-xs border border-brand-teal/30";
        } else {
          pill.className = "text-[10px] px-2 py-0.5 rounded-md font-medium bg-transparent text-brand-muted hover:bg-white/60";
        }
      });

      otpInputs.forEach(i => {
        i.disabled = false;
        i.classList.remove('error-state');
      });

      if (state === 'default') {
        // Pre-fill valid 6-digit OTP for active demo state
        const sampleOtp = ['4', '8', '2', '9', '1', '5'];
        otpInputs.forEach((input, i) => {
          input.value = sampleOtp[i];
          input.classList.add('filled');
        });
        clearStatus();
        btnVerifyCta.disabled = false;
        startCountdown();
      } else if (state === 'invalid') {
        const sampleOtp = ['1', '2', '3', '4', '5', '6'];
        otpInputs.forEach((input, i) => {
          input.value = sampleOtp[i];
          input.classList.add('filled', 'error-state');
        });
        showStatus('error', i18n[currentLang].errorInvalid);
        btnVerifyCta.disabled = false;
      } else if (state === 'expired') {
        const sampleOtp = ['9', '0', '1', '2', '3', '4'];
        otpInputs.forEach((input, i) => {
          input.value = sampleOtp[i];
          input.classList.add('filled', 'error-state');
        });
        showStatus('error', i18n[currentLang].errorExpired);
        resendCountdown.classList.add('hidden');
        btnResendAction.classList.remove('hidden');
        btnVerifyCta.disabled = false;
      } else if (state === 'locked') {
        otpInputs.forEach(input => {
          input.value = '•';
          input.disabled = true;
          input.classList.remove('filled');
        });
        showStatus('error', i18n[currentLang].errorLocked);
        btnVerifyCta.disabled = true;
      }
    }

    // Initialize Default State on Load
    window.addEventListener('DOMContentLoaded', () => {
      setDemoState('default');
    });
  </script>


</body></html>
